<!DOCTYPE html>
<html lang="de">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Hold'em</title>

  <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

  <div class="topbar">
      <h1>Texas Hold'em</h1>

      <div class="info">
          <span id="pot">Pot: 0</span>
          <span id="phase">Pre-Flop</span>
          <span id="currentBet">
            Bet: 20
          </span>
      </div>
  </div>

  <div class="table">

      <div id="community" class="community"></div>

      <div id="bots" class="bots"></div>

      <div class="player">

          <h3 id="playerName">
                YOU
          </h3>

          <div id="playerCards" class="cards"></div>

          <div class="chips">
              Chips:
              <span id="playerChips">1000</span>
          </div>

          <div>
              Bet:
              <span id="playerBet">0</span>
          </div>

      </div>
      <div id="dealerButton">
      D
      </div>
      <div id="potCenter">
          Pot: 0
      </div>
  
    </div>

  <div class="controls">

      <input
          type="number"
          id="betAmount"
          value="20"
          min="20"
      >

      <button id="checkBtn">Check</button>
      <button id="callBtn">Call</button>
      <button id="betBtn">Bet</button>
      <button id="raiseBtn">Raise</button>
      <button id="foldBtn">Fold</button>
      <button id="allInBtn">All In</button>

  </div>

  <div id="message"></div>

  <script src="js/player.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/evaluator.js"></script>
  <script src="js/betting.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>

  </body>
</html>
